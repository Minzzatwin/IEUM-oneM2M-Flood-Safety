<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <style>
    .title { font: bold 34px Arial, sans-serif; fill: #183447; }
    .subtitle { font: 20px Arial, sans-serif; fill: #5d6d78; }
    .section { font: bold 21px Arial, sans-serif; fill: #ffffff; }
    .label { font: bold 21px Arial, sans-serif; fill: #183447; }
    .small { font: 17px Arial, sans-serif; fill: #5d6d78; }
    .note { font: bold 19px Arial, sans-serif; fill: #009b98; }
    .box { fill: #eaf5f5; stroke: #009b98; stroke-width: 2; }
    .area { fill: #f5f9fa; stroke: #b7c8cf; stroke-width: 2; }
    .edge { stroke: #183447; stroke-width: 3; fill: none; marker-end: url(#arrow); }
    .dashed { stroke: #788891; stroke-width: 3; stroke-dasharray: 10 8; fill: none; marker-end: url(#arrow); }
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#183447"/></marker>
  </defs>
