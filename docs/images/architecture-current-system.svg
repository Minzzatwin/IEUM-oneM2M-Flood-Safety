<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120">
  <style>
    .title { font: bold 38px Arial, sans-serif; fill: #17324d; }
    .subtitle { font: 21px Arial, sans-serif; fill: #526579; }
    .step { font: bold 23px Arial, sans-serif; fill: #17324d; }
    .label { font: bold 22px Arial, sans-serif; fill: #17324d; }
    .text { font: 19px Arial, sans-serif; fill: #405466; }
    .mono { font: 18px Consolas, monospace; fill: #274c66; }
    .flow { font: 18px Arial, sans-serif; fill: #526579; }
    .note { font: 18px Arial, sans-serif; fill: #647789; }
    .panel { stroke: #c7d4df; stroke-width: 2; }
    .sensor { fill: #e8f4ff; }
    .cse { fill: #eaf8f1; }
    .engine { fill: #fff6df; }
    .outputs { fill: #f0ebff; }
    .monitor { fill: #f2f5f7; }
    .container { fill: #ffffff; stroke: #b6c6d3; stroke-width: 2; }
    .arrow { stroke: #526579; stroke-width: 3; fill: none; marker-end: url(#arrow); }
    .branch { stroke: #526579; stroke-width: 3; fill: none; marker-end: url(#arrow); }
  </style>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#526579"/>
    </marker>
  </defs>

  <rect width="1600" height="1120" fill="#ffffff"/>
  <text x="800" y="58" text-anchor="middle" class="title">Current Implemented System Architecture</text>
  <text x="800" y="92" text-anchor="middle" class="subtitle">oneM2M sensor publishing, local rule-based risk analysis, and terminal actuator monitoring</text>

  <rect x="160" y="130" width="1280" height="120" rx="14" class="panel sensor"/>
  <text x="205" y="172" class="step">1. Sensor Layer</text>
  <text x="205" y="207" class="text">Python virtual sensor</text>
  <text x="205" y="235" class="text">Water level - Rainfall - River level</text>

  <path d="M800 250 L800 305" class="arrow"/>
  <text x="830" y="285" class="flow">HTTP POST / contentInstance</text>

  <rect x="160" y="320" width="1280" height="145" rx="14" class="panel cse"/>
  <text x="205" y="362" class="step">2. oneM2M MN-CSE</text>
  <text x="205" y="397" class="text">ACME CSE resource tree</text>
  <rect x="205" y="414" width="360" height="34" rx="5" fill="#d8efe2"/>
  <text x="225" y="438" class="mono">SensorAE/cnt_water_level</text>

  <path d="M800 465 L800 520" class="arrow"/>
  <text x="830" y="500" class="flow">HTTP GET with rcn=4 - CIN history query</text>

  <rect x="160" y="535" width="1280" height="155" rx="14" class="panel engine"/>
  <text x="205" y="578" class="step">3. Edge Risk Analysis</text>
  <text x="205" y="615" class="text">ieum_edge_integrated.py runs on the local PC</text>
  <text x="205" y="647" class="text">Input validation - threshold rules - risk level decision</text>
  <text x="205" y="675" class="text">Rule-based analysis; no trained machine-learning model</text>

  <path d="M800 690 L800 735" class="arrow"/>
  <text x="830" y="719" class="flow">HTTP POST - risk result and control records</text>

  <rect x="160" y="750" width="610" height="175" rx="14" class="panel outputs"/>
  <text x="200" y="792" class="step">4. RiskAnalysisAE</text>
  <text x="200" y="828" class="text">Risk assessment and history</text>
  <rect x="200" y="846" width="295" height="30" rx="5" fill="#e1d9ff"/>
  <text x="216" y="868" class="mono">cnt_risk_level</text>
  <rect x="200" y="884" width="295" height="30" rx="5" fill="#e1d9ff"/>
  <text x="216" y="906" class="mono">cnt_risk_history</text>

  <rect x="830" y="750" width="610" height="175" rx="14" class="panel outputs"/>
  <text x="870" y="792" class="step">5. EdgeAE</text>
  <text x="870" y="828" class="text">Safety-control records</text>
  <rect x="870" y="846" width="335" height="30" rx="5" fill="#e1d9ff"/>
  <text x="886" y="868" class="mono">cnt_barrier_control</text>
  <rect x="870" y="884" width="335" height="30" rx="5" fill="#e1d9ff"/>
  <text x="1218" y="868" class="mono">cnt_warning_control</text>
  <rect x="1218" y="884" width="190" height="30" rx="5" fill="#e1d9ff"/>
  <text x="1234" y="906" class="mono">cnt_detour_info</text>

  <path d="M800 925 L800 970" class="arrow"/>
  <text x="830" y="955" class="flow">HTTP GET / latest CIN</text>

  <rect x="160" y="985" width="1280" height="90" rx="14" class="panel monitor"/>
  <text x="205" y="1025" class="step">6. Actuator Monitor</text>
  <text x="205" y="1057" class="text">Terminal-based status monitor: barrier, warning, and detour information</text>

  <text x="800" y="1105" text-anchor="middle" class="note">Current prototype boundary: physical sensors and physical barriers are not connected in the submitted code.</text>
</svg>
