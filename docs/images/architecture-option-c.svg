<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <style>
    .title { font: bold 34px Arial, sans-serif; fill: #183447; }
    .subtitle { font: 20px Arial, sans-serif; fill: #5d6d78; }
    .section { font: bold 22px Arial, sans-serif; fill: #ffffff; }
    .label { font: bold 21px Arial, sans-serif; fill: #183447; }
    .small { font: 17px Arial, sans-serif; fill: #5d6d78; }
    .note { font: 19px Arial, sans-serif; fill: #009b98; }
    .box { fill: #eaf5f5; stroke: #009b98; stroke-width: 2; }
    .area { fill: #f5f9fa; stroke: #b7c8cf; stroke-width: 2; }
    .edge { stroke: #183447; stroke-width: 3; fill: none; marker-end: url(#arrow); }
    .teal-edge { stroke: #009b98; stroke-width: 3; fill: none; marker-end: url(#tealArrow); }
    .dashed { stroke: #788891; stroke-width: 3; stroke-dasharray: 10 8; fill: none; marker-end: url(#arrow); }
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#183447"/></marker>
    <marker id="tealArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#009b98"/></marker>
  </defs>
  <text x="60" y="58" class="title">System Architecture - Option C</text>
  <text x="60" y="92" class="subtitle">Underground infrastructure flood-risk management and local safety control</text>
  <rect x="60" y="125" width="1480" height="105" class="area"/>
  <text x="82" y="162" class="label">CLOUD</text>
  <rect x="560" y="145" width="320" height="65" class="box"/>
  <text x="720" y="174" text-anchor="middle" class="label">oneM2M IN-CSE</text>
  <text x="720" y="197" text-anchor="middle" class="small">Site-level data aggregation</text>
  <rect x="1060" y="145" width="320" height="65" class="box"/>
  <text x="1220" y="174" text-anchor="middle" class="label">Cloud IN-AE</text>
  <text x="1220" y="197" text-anchor="middle" class="small">Integrated monitoring dashboard</text>
  <path d="M880 178 L1060 178" class="edge"/>
  <text x="970" y="165" text-anchor="middle" class="small">Mca</text>
  <rect x="60" y="275" width="1480" height="330" class="area"/>
  <rect x="60" y="275" width="1480" height="42" fill="#009b98"/>
  <text x="82" y="303" class="section">EDGE - Site A (demonstration target)</text>
  <rect x="110" y="350" width="330" height="105" class="box"/>
  <text x="275" y="390" text-anchor="middle" class="label">Risk Analysis MN-AE</text>
  <text x="275" y="420" text-anchor="middle" class="small">Risk analysis using level and rise rate</text>
  <rect x="110" y="495" width="330" height="105" class="box"/>
  <text x="275" y="535" text-anchor="middle" class="label">Control MN-AE</text>
  <text x="275" y="565" text-anchor="middle" class="small">Control commands and status</text>
  <rect x="620" y="365" width="330" height="190" class="box"/>
  <text x="785" y="410" text-anchor="middle" class="label">oneM2M MN-CSE</text>
  <text x="785" y="445" text-anchor="middle" class="small">MEC application deployment</text>
  <text x="785" y="472" text-anchor="middle" class="small">Sensor CINs, risk results,</text>
  <text x="785" y="497" text-anchor="middle" class="small">and control events</text>
  <rect x="1130" y="365" width="330" height="190" class="box"/>
  <text x="1295" y="410" text-anchor="middle" class="label">MEC Platform</text>
  <text x="1295" y="445" text-anchor="middle" class="small">Sensor data service</text>
  <text x="1295" y="472" text-anchor="middle" class="small">MEC service API</text>
  <text x="1295" y="499" text-anchor="middle" class="small">and MN-CSE integration</text>
  <path d="M720 230 L720 365" class="edge"/>
  <text x="750" y="300" class="small">Mcc</text>
  <path d="M620 440 L440 400" class="edge"/>
  <path d="M620 490 L440 545" class="edge"/>
  <path d="M1130 460 L950 460" class="teal-edge"/>
  <text x="1040" y="445" text-anchor="middle" class="note">MEC data link</text>
  <rect x="130" y="680" width="300" height="90" class="box"/>
  <text x="280" y="718" text-anchor="middle" class="label">Controlled Devices</text>
  <text x="280" y="745" text-anchor="middle" class="small">Barrier, warning, simulator</text>
  <rect x="665" y="680" width="300" height="90" class="area"/>
  <text x="815" y="718" text-anchor="middle" class="label">oneM2M Device</text>
  <text x="815" y="745" text-anchor="middle" class="small">Optional direct Mca path</text>
  <rect x="1160" y="680" width="300" height="90" class="box"/>
  <text x="1310" y="718" text-anchor="middle" class="label">Non-oneM2M Devices</text>
  <text x="1310" y="745" text-anchor="middle" class="small">Water, rain, river sensors</text>
  <path d="M275 600 L275 680" class="teal-edge"/>
  <path d="M1310 680 L1310 555" class="teal-edge"/>
  <text x="80" y="840" class="note">Analysis and control operate at the edge using data stored in the MN-CSE.</text>
  <text x="80" y="870" class="small">Dashed or optional components describe the target architecture and are not claims of completed implementation.</text>
</svg>
